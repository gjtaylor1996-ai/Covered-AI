name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: covered
          POSTGRES_PASSWORD: covered
          POSTGRES_DB: covered_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U covered"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://covered:covered@localhost:5432/covered_test
      AUTH_SECRET: ci-only-secret-not-for-real-use-0000000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
